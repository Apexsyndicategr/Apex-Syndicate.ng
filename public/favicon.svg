<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Vibrant Apex Syndicate Diamond Orange Gradient -->
    <linearGradient id="apexDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="45%" stop-color="#FF5000" />
      <stop offset="100%" stop-color="#E02200" />
    </linearGradient>

    <!-- Specular Diamond Highlight -->
    <linearGradient id="apexSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Drop Shadow for Tab Contrast -->
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF5000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Centered Rotated Orange Diamond with Smooth Rounded Corners -->
  <g transform="translate(128, 128) rotate(45)" filter="url(#tabShadow)">
    <!-- Base Orange Diamond -->
    <rect x="-76" y="-76" width="152" height="152" rx="26" fill="url(#apexDiamondGrad)" />
    
    <!-- Top-Half Subtle Specular Curve -->
    <rect x="-76" y="-76" width="152" height="76" rx="26" fill="url(#apexSpecular)" />
  </g>

  <!-- Crisp White "AS" Lettering -->
  <text x="128" y="152" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Arial Black', 'Impact', 'Montserrat', sans-serif" 
        font-size="94" 
        font-weight="900" 
        letter-spacing="-3" 
        fill="#FFFFFF">
    AS
  </text>
</svg>
