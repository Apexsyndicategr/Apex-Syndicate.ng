<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Ambient Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Diamond Orange to Red Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#D61800" />
    </linearGradient>

    <!-- Highlight Reflection on Diamond -->
    <linearGradient id="diamondHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="#0d0e12" rx="64" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" />

  <!-- Rotated Diamond / Rhombus with Smooth Rounded Corners -->
  <g transform="translate(256, 256) rotate(45)" filter="url(#softGlow)">
    <!-- Shadow Base -->
    <rect x="-142" y="-142" width="284" height="284" rx="42" fill="#991500" opacity="0.6" />
    
    <!-- Main Vibrant Orange Diamond Body -->
    <rect x="-140" y="-140" width="280" height="280" rx="40" fill="url(#diamondGrad)" />
    
    <!-- Crisp Inner Bevel Border -->
    <rect x="-136" y="-136" width="272" height="272" rx="36" fill="none" stroke="#FFA366" stroke-width="5" stroke-opacity="0.75" />
    
    <!-- Top-Half Subtle Specular Highlight -->
    <rect x="-136" y="-136" width="272" height="136" rx="36" fill="url(#diamondHighlight)" />
  </g>

  <!-- High-Precision Crisp "AS" Typography -->
  <g transform="translate(256, 256)">
    <!-- Letter Shadow for Maximum Legibility -->
    <text x="0" y="44" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Arial Black', 'Impact', 'Montserrat', sans-serif" 
          font-size="164" 
          font-weight="900" 
          letter-spacing="-6" 
          fill="#5a0800" 
          opacity="0.6">
      AS
    </text>
    <!-- Crisp Solid White "AS" Lettering -->
    <text x="0" y="40" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Arial Black', 'Impact', 'Montserrat', sans-serif" 
          font-size="164" 
          font-weight="900" 
          letter-spacing="-6" 
          fill="#FFFFFF">
      AS
    </text>
  </g>
</svg>
